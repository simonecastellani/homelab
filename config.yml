# Single source of truth for homelab network and guest configuration.
# Both Terraform and Ansible derive their values from this file via scripts/generate-configs.sh.

network:
  lan_subnet: "192.168.178.0/24"
  gateway: "192.168.178.1"
  bridge: "vmbr0"
  nameservers:
    - "1.1.1.1"
    - "8.8.8.8"

proxmox:
  host: "192.168.178.200"
  node: "proxmox"
  port: 8006
  token_id: "terraform@pam!ci"
  # token_secret is set via CI secret PROXMOX_TOKEN_SECRET

guests:
  pihole:
    role: dns
    hostname: pihole
    vm_id: 201
    description: "Pi-hole DNS server"
    static_ip: "192.168.178.201"
    cores: 1
    memory: 512
    disk: 8
    storage: "local-lvm"
    features:
      nesting: true
      unprivileged: true

  homeassistant:
    role: home_automation
    hostname: homeassistant
    vm_id: 202
    description: "Home Assistant (Docker in LXC)"
    static_ip: "192.168.178.202"
    cores: 2
    memory: 2048
    disk: 32
    storage: "local-lvm"
    # Container image for Docker Compose inside the LXC
    docker_image: "ghcr.io/home-assistant/home-assistant:stable"
    features:
      nesting: true
      unprivileged: true

  opencode:
    role: vps
    hostname: opencode
    vm_id: 203
    description: "OpenCode VPS"
    static_ip: "192.168.178.203"
    cores: 2
    memory: 4096
    disk: 32
    storage: "local-lvm"
    features:
      nesting: true
      unprivileged: true
  
  laminar:
    role: laminar
    hostname: laminar
    vm_id: 204
    description: "Laminar AI VPS"
    static_ip: "192.168.178.204"
    cores: 2
    memory: 4096
    disk: 32
    storage: "local-lvm"
    features:
      nesting: true
      unprivileged: true