name: Terraform Apply + Ansible Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "ansible/**"
      - "config.yml"

jobs:
  apply:
    runs-on: self-hosted
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Setup yq
        run: |
          wget -qO "$RUNNER_TEMP/yq" https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Generate configs
        run: ../scripts/generate-configs.sh

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Generate Ansible inventory
        run: |
          terraform output -json > ../ansible/inventory.json
          ../scripts/generate-inventory.sh

      - name: Run Ansible
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.yml playbook.yml \
            --extra-vars "pihole_admin_password=${{ secrets.PIHOLE_ADMIN_PASSWORD }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          CLOUDFLARE_ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
          LAMINAR_AUTH_SECRET: ${{ secrets.LAMINAR_AUTH_SECRET }}
          LAMINAR_GITHUB_OAUTH_ID: ${{ secrets.LAMINAR_GITHUB_OAUTH_ID }}
          LAMINAR_GITHUB_OAUTH_SECRET: ${{ secrets.LAMINAR_GITHUB_OAUTH_SECRET }}
