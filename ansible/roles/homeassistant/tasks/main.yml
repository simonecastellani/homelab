---
# Home Assistant is deployed via Docker Compose inside a Debian LXC.
# Raw LXC config is required for Docker-in-LXC (cgroup devices, tun).

- name: Configure LXC for Docker on Proxmox host
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ homeassistant_vm_id | default(202) }}.conf"
    line: "{{ item }}"
    state: present
  delegate_to: "{{ proxmox_host }}"
  become: true
  loop:
    - "lxc.cgroup2.devices.allow: c 10:200 rwm"
    - "lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file"
  notify: Restart homeassistant container

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/debian/gpg
    keyring: /etc/apt/keyrings/docker.gpg
    state: present

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure pi user is in docker group
  ansible.builtin.user:
    name: root
    groups: docker
    append: true

- name: Ensure Home Assistant config directory exists
  ansible.builtin.file:
    path: /opt/homeassistant/config
    state: directory
    mode: "0755"

- name: Deploy Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/homeassistant/docker-compose.yml
    mode: "0644"
  notify: Restart Home Assistant

- name: Ensure Home Assistant is running
  ansible.builtin.command:
    cmd: docker compose -f /opt/homeassistant/docker-compose.yml up -d
  args:
    chdir: /opt/homeassistant
  changed_when: true
