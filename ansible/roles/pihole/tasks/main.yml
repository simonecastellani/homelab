---
# Pi-hole runs in an unprivileged LXC. It needs CAP_NET_BIND_SERVICE to bind
# port 53. The Proxmox host LXC config is updated before installation.

# net_bind_service is required for Pi-hole to bind port 53 in an
# unprivileged LXC. Other LXC features (nesting, keyctl, device
# passthrough) are now managed by Terraform. This single lineinfile
# is the only remaining LXC config leak across the Ansible seam —
# the bpg/proxmox provider does not yet expose custom capabilities.
- name: Allow unprivileged pi-hole LXC to bind port 53
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ guests.pihole.vm_id | default(201) }}.conf"
    line: "lxc.cap.add: net_bind_service"
    state: present
  delegate_to: "{{ proxmox_host }}"
  notify: Restart pi-hole container

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - git
    state: present

- name: Install Pi-hole
  ansible.builtin.shell: |
    curl -sSL https://install.pi-hole.net | bash /dev/stdin --unattended
  args:
    creates: /etc/pihole/setupVars.conf
  environment:
    PIHOLE_SKIP_OS_CHECK: "true"

- name: Configure Pi-hole admin password
  ansible.builtin.command:
    cmd: pihole -a -p "{{ pihole_admin_password }}"
  no_log: true
  changed_when: true
