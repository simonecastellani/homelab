---
- name: Ensure runner directory exists
  ansible.builtin.file:
    path: "{{ github_runner_dir }}"
    state: directory
    mode: "0755"

- name: Query latest GitHub Actions runner version
  ansible.builtin.uri:
    url: https://api.github.com/repos/actions/runner/releases/latest
    return_content: true
  register: runner_release

- name: Set runner version fact
  ansible.builtin.set_fact:
    runner_version: "{{ runner_release.json.tag_name | regex_replace('^v', '') }}"

- name: Check if runner is already installed at the latest version
  ansible.builtin.stat:
    path: "{{ github_runner_dir }}/.version"
  register: version_file

- name: Read installed version
  ansible.builtin.slurp:
    src: "{{ github_runner_dir }}/.version"
  register: installed_version
  when: version_file.stat.exists

- name: Download runner archive
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz"
    dest: "{{ github_runner_dir }}/actions-runner.tar.gz"
    mode: "0644"
  when: >
    not version_file.stat.exists
    or (installed_version.content | b64decode | trim) != runner_version

- name: Extract runner archive
  ansible.builtin.unarchive:
    src: "{{ github_runner_dir }}/actions-runner.tar.gz"
    dest: "{{ github_runner_dir }}"
    remote_src: true
  when: >
    not version_file.stat.exists
    or (installed_version.content | b64decode | trim) != runner_version

- name: Record installed version
  ansible.builtin.copy:
    content: "{{ runner_version }}"
    dest: "{{ github_runner_dir }}/.version"
    mode: "0644"

- name: Check if runner is already configured
  ansible.builtin.stat:
    path: "{{ github_runner_dir }}/.runner"
  register: runner_configured

- name: Validate required variables are set
  ansible.builtin.fail:
    msg: |
      github_repo and github_runner_token must be provided.
      Example:
        --extra-vars "github_repo=https://github.com/ORG/REPO"
        --extra-vars "github_runner_token=TOKEN_FROM_GITHUB"
  when: github_repo == "" or github_runner_token == ""

- name: Configure GitHub Actions runner
  ansible.builtin.command:
    cmd: "./config.sh --url {{ github_repo }} --token {{ github_runner_token }} --name {{ github_runner_name }} --unattended --replace"
  args:
    chdir: "{{ github_runner_dir }}"
  environment:
    RUNNER_ALLOW_RUNASROOT: "1"
  when: not runner_configured.stat.exists
  register: runner_config
  changed_when: runner_config.rc == 0

- name: Fail on runner config error
  ansible.builtin.fail:
    msg: |
      GitHub Actions runner configuration failed.
      Return code: {{ runner_config.rc }}
      Stdout: {{ runner_config.stdout | default('') }}
      Stderr: {{ runner_config.stderr | default('') }}
  when: runner_config.rc is defined and runner_config.rc != 0

- name: Compute expected systemd service name
  ansible.builtin.set_fact:
    github_runner_repo_slug: "{{ github_repo | regex_replace('^https?://github\\.com/', '') | regex_replace('/', '-') }}"

- name: Check if runner service is installed
  ansible.builtin.stat:
    path: "/etc/systemd/system/actions.runner.{{ github_runner_repo_slug }}.{{ github_runner_name }}.service"
  register: runner_service_file

- name: Install runner as systemd service
  ansible.builtin.command:
    cmd: ./svc.sh install
  args:
    chdir: "{{ github_runner_dir }}"
  register: svc_install
  failed_when:
    - svc_install.rc != 0
    - "'exists' not in svc_install.stderr"
  changed_when: svc_install.rc == 0

- name: Add systemd override for root execution
  ansible.builtin.lineinfile:
    path: "/etc/systemd/system/actions.runner.{{ github_runner_repo_slug }}.{{ github_runner_name }}.service.d/override.conf"
    line: "Environment=RUNNER_ALLOW_RUNASROOT=1"
    create: true
    state: present
  notify: Daemon reload

- name: Ensure runner service is running
  ansible.builtin.systemd:
    name: "actions.runner.{{ github_runner_repo_slug }}.{{ github_runner_name }}.service"
    state: started
    enabled: true
    daemon_reload: true

- name: Report runner status
  ansible.builtin.command:
    cmd: ./svc.sh status
  args:
    chdir: "{{ github_runner_dir }}"
  changed_when: false
