---
# Download the Debian 12 LXC template to a stable filename.
# Terraform container resources reference the stable name so they never need
# to change when Proxmox updates the upstream template version.
#
# Uses pveam to discover the latest version, then wget to download directly
# to a predictable path — bypasses pveam download's API permission requirements.

- name: Ensure pveam is available
  ansible.builtin.command:
    cmd: which pveam
  changed_when: false

- name: Check if stable template already exists
  ansible.builtin.stat:
    path: "/var/lib/vz/template/cache/{{ proxmox_template_stable_name }}"
  register: stable_template

- name: Update pveam template list
  ansible.builtin.command:
    cmd: pveam update
  when: not stable_template.stat.exists
  changed_when: true

- name: Discover latest Debian 12 template
  ansible.builtin.shell:
    cmd: pveam available | grep -oP '{{ proxmox_template_prefix }}[^\s]+\.tar\.zst' | sort -V | tail -1
  register: pveam_discover
  when: not stable_template.stat.exists
  changed_when: false
  failed_when: pveam_discover.stdout | length == 0

- name: Download template to stable filename
  ansible.builtin.command:
    cmd: >-
      wget -q -O
      /var/lib/vz/template/cache/{{ proxmox_template_stable_name }}
      http://download.proxmox.com/images/system/{{ pveam_discover.stdout | trim }}
  when: not stable_template.stat.exists
  changed_when: true
