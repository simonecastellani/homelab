---
- name: Validate Laminar public authentication settings
  ansible.builtin.assert:
    that:
      - laminar_auth_secret | length >= 32
      - laminar_github_oauth_id | length > 0
      - laminar_github_oauth_secret | length > 0
    fail_msg: >-
      LAMINAR_AUTH_SECRET (at least 32 characters), LAMINAR_GITHUB_OAUTH_ID,
      and LAMINAR_GITHUB_OAUTH_SECRET must be set.
  no_log: true

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/debian/gpg
    keyring: /etc/apt/keyrings/docker.gpg
    state: present

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure laminar user is in docker group
  ansible.builtin.user:
    name: laminar
    groups: docker
    append: true

- name: Clone git repository for Laminar AI
  ansible.builtin.git:
    repo: "{{ laminar_git_repo }}"
    dest: /opt/lmnr
    version: "main"

- name: Deploy Laminar public authentication configuration
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: /opt/lmnr/docker-compose.override.yml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Laminar AI

- name: Ensure Laminar AI is running
  ansible.builtin.command:
    cmd: docker compose up -d
  args:
    chdir: /opt/lmnr
  changed_when: true
