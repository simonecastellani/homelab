---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/debian/gpg
    keyring: /etc/apt/keyrings/docker.gpg
    state: present

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure opencode user is in docker group
  ansible.builtin.user:
    name: opencode
    groups: docker
    append: true

- name: Install opencode AI
  # command does not run through a shell, so the pipe would be passed to
  # curl as a literal argument. The installer must also run as the opencode
  # user so the binary lands in /home/opencode/.opencode/bin.
  ansible.builtin.shell: |
    curl -fsSL https://opencode.ai/v2/install | bash /dev/stdin
  become: true
  become_user: opencode
  # The play connects as root and sudo may not be installed on this host,
  # while root -> opencode via su needs no password.
  become_method: su
  args:
    creates: /home/opencode/.opencode/bin/opencode
