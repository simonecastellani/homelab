---
- name: Validate reverse proxy secrets
  ansible.builtin.assert:
    that:
      - reverse_proxy_origin_certificate | length > 0
      - reverse_proxy_origin_private_key | length > 0
    fail_msg: "CLOUDFLARE_ORIGIN_CERT and CLOUDFLARE_ORIGIN_KEY must be set."
  no_log: true

- name: Install Caddy repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Caddy repository signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /usr/share/keyrings/caddy-stable-archive-keyring.asc
    mode: "0644"

- name: Add Caddy repository
  ansible.builtin.deb822_repository:
    name: caddy
    types: deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/debian
    suites: any-version
    components: main
    signed_by: /usr/share/keyrings/caddy-stable-archive-keyring.asc
    state: present

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Retrieve Cloudflare IPv4 ranges
  ansible.builtin.uri:
    url: https://www.cloudflare.com/ips-v4
    return_content: true
  register: reverse_proxy_cloudflare_ipv4
  changed_when: false

- name: Retrieve Cloudflare IPv6 ranges
  ansible.builtin.uri:
    url: https://www.cloudflare.com/ips-v6
    return_content: true
  register: reverse_proxy_cloudflare_ipv6
  changed_when: false

- name: Store Cloudflare IP ranges
  ansible.builtin.set_fact:
    reverse_proxy_cloudflare_ips_v4: "{{ reverse_proxy_cloudflare_ipv4.content.splitlines() }}"
    reverse_proxy_cloudflare_ips_v6: "{{ reverse_proxy_cloudflare_ipv6.content.splitlines() }}"

- name: Ensure Caddy certificate directory exists
  ansible.builtin.file:
    path: /etc/caddy/certs
    state: directory
    owner: root
    group: caddy
    mode: "0750"

- name: Deploy Cloudflare Origin CA certificate
  ansible.builtin.copy:
    content: "{{ reverse_proxy_origin_certificate }}\n"
    dest: /etc/caddy/certs/cloudflare-origin.pem
    owner: root
    group: caddy
    mode: "0640"
  no_log: true
  notify: Restart Caddy

- name: Deploy Cloudflare Origin CA private key
  ansible.builtin.copy:
    content: "{{ reverse_proxy_origin_private_key }}\n"
    dest: /etc/caddy/certs/cloudflare-origin.key
    owner: root
    group: caddy
    mode: "0640"
  no_log: true
  notify: Restart Caddy

- name: Deploy Caddy configuration
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: caddy validate --config %s --adapter caddyfile
  notify: Restart Caddy

- name: Ensure Caddy is running
  ansible.builtin.systemd:
    name: caddy
    state: started
    enabled: true
